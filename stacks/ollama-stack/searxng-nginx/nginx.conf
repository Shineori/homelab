# searxng-nginx: sits in front of SearXNG (inside gluetun) and injects custom CSS
#   Browser :8888 ──► nginx ──► gluetun:8080 (SearXNG) ──► ProtonVPN ──► engines
#   Open WebUI still talks to gluetun:8080 directly (no CSS needed for the API).

server {
    listen 80;
    server_name _;

    # Docker's internal DNS, re-resolved so a gluetun restart never leaves nginx pointing at a dead IP
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $searxng http://gluetun:8080;

    # Our stylesheet(s): edit the file on disk, refresh the browser, done
    location /custom/ {
        alias /usr/share/nginx/custom/;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass $searxng;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # sub_filter can't edit compressed responses, so ask SearXNG for plain HTML
        proxy_set_header Accept-Encoding "";

        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/custom/google.css" type="text/css"></head>';

        # Saving preferences returns ~22 cookies (6+ KB of headers); the 4 KB default overflows -> 502
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;

        proxy_read_timeout 30s;
    }
}
