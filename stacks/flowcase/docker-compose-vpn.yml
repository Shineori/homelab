# VPN egress for Flowcase workspaces.
# Any droplet set to Docker Network "flowcase_vpn" sends its internet traffic through this container.
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: flowcase-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    env_file:
      - vpn.env
    environment:
      - FIREWALL_OUTBOUND_SUBNETS=172.30.0.0/24
    volumes:
      - ./gluetun/post-rules.txt:/iptables/post-rules.txt:ro
    networks:
      flowcase_vpn:
        ipv4_address: 172.30.0.2

networks:
  flowcase_vpn:
    name: flowcase_vpn
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
          ip_range: 172.30.0.128/25   # workspaces get .128-.254; .2 stays reserved for gluetun
