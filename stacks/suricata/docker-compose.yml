services:
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./logs:/var/log/suricata
      - ./lib:/var/lib/suricata
    command: -i eth0 -s /var/lib/suricata/rules/local.rules
    restart: unless-stopped
