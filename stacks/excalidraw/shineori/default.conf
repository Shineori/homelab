# One hostname for everything: app, collab socket, storage API
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8080;
  client_max_body_size 50m;

  # live collaboration (socket.io) -> excalidraw-room
  location /socket.io/ {
    proxy_pass http://excalidraw-room:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # scenes / rooms / images -> storage backend (postgres)
  location /api/v2/ {
    proxy_pass http://excalidraw-storage:8080;
    proxy_set_header Host $host;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html =404;
  }
}
