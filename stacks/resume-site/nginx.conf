server {
    listen 8080;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;   # don't advertise the NGINX version (less recon info)

    # 🔒 Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only allow your own files + Google Fonts. Blocks injected scripts (XSS) from loading.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Let browsers cache CSS/JS/PDF for a day
    location ~* \.(css|js|pdf)$ {
        expires 1d;
    }

    # Never serve hidden files like .git or .env
    location ~ /\. {
        deny all;
    }
}
