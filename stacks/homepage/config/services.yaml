    - Radarr:
        icon: radarr.svg
        href: http://<LAN_IP>:7878
        server: shinas
        container: radarr
        widget:
          type: radarr
          url: http://<LAN_IP>:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
    - Lidarr:
        icon: lidarr.svg
        href: http://<LAN_IP>:8686
        server: shinas
        container: lidarr
        widget:
          type: lidarr
          url: http://<LAN_IP>:8686
          key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"
    - Prowlarr:
        icon: prowlarr.svg
