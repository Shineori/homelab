    - qBittorrent:
        icon: qbittorrent.svg
        href: http://<LAN_IP>:8701     # guessed from gluetun's ports, fix if the WebUI lives elsewhere
        description: behind gluetun / ProtonVPN
        server: shinas
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://<LAN_IP>:8701
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: <redacted>
