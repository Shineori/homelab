# Immich machine learning on the laptop's RTX 2060, for the NAS's Immich server
services:
  immich-machine-learning:
    container_name: immich_machine_learning
    # must match the NAS's Immich version exactly; -cuda = NVIDIA GPU build
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.1-cuda
    volumes:
      - model-cache:/cache            # downloaded AI models live here
    ports:
      - "<LAN_IP>:3003:3003"       # LAN only, for the NAS to reach it
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model-cache:
