# =============================================================
#  <redacted-domain>  |  Shineori SMP (Java + Bedrock)
#    - mc     : Paper server (Java 25565/tcp, Bedrock 19132/udp)
#    - playit : tunnel agent, exposes both to the internet
#  No router port-forward or DDNS needed.
# =============================================================

services:
  mc:
    image: itzg/minecraft-server:latest   # if logs show UnsupportedClassVersionError, use :java25
    container_name: shineori-mc
    tty: true
    stdin_open: true
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION_FROM_MODRINTH_PROJECTS: "true"   # newest MC version all plugins support
      MODRINTH_PROJECTS: |
        luckperms
        essentialsx
        coreprotect
        griefprevention
        chunky
        viaversion
        viabackwards
      # Bedrock support (Geyser + Floodgate), straight from GeyserMC
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
      MEMORY: "6G"
      DIFFICULTY: "normal"
      MOTD: "<redacted-domain> | Shineori SMP"
      MAX_PLAYERS: "10"
      ONLINE_MODE: "TRUE"          # keep TRUE: tunnel is public, only legit accounts
      ENABLE_WHITELIST: "TRUE"     # extra important with a public tunnel
      OPS: "Shineori"
      TZ: "America/New_York"
    ports:
      - "25565:25565"              # Java (playit tunnel -> <LAN_IP>:25565)
      - "19132:19132/udp"          # Bedrock via Geyser (playit tunnel -> <LAN_IP>:19132)
    volumes:
      - ./mc-data:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 1m
      interval: 20s
      retries: 10

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: shineori-playit
    restart: unless-stopped
    network_mode: host
    environment:
      SECRET_KEY: <redacted>
    depends_on:
      - mc
