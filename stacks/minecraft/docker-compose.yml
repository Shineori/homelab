# =============================================================
#  <redacted-domain>  |  Shineori SMP (Java + Bedrock)
#    - mc     : Fabric server (Java 25565/tcp, Bedrock 19132/udp)
#               Geyser + Floodgate (Fabric) for Bedrock, NetherNet via Warden
#               BlueMap web map on 8100/tcp (LAN port; published through the NAS's tunnel)
#    - playit : tunnel agent, exposes both to the internet
#  No router port-forward or DDNS needed.
# =============================================================

services:
  mc:
    image: itzg/minecraft-server:latest   # if logs show UnsupportedClassVersionError, use :java25
    container_name: shineori-mc
    env_file:
      - rcon.env                 # RCON_PASSWORD shared with my Discord bot (chmod 600, never committed)
    networks:
      - default
      - mc-bridge                # the bot reaches RCON here; port 25575 is never published
    tty: true
    stdin_open: true
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"   # pinned: world is on 26.3 (auto-resolve failed with geyser/floodgate)
      MODRINTH_PROJECTS: |
        fabric-api
        polymer
        polydecorations
        geyser
        floodgate
        bluemap
        chunky
        lithium
        ferrite-core
        krypton
        spark
        scalablelux:g4eqNSKd
        c2me-fabric:gKKkuSYc
        open-parties-and-claims
        forge-config-api-port
        netherportalfix
        balm
        appleskin
        jade
        terralith
        lithostitched
      MODRINTH_ALLOWED_VERSION_TYPE: "beta"   # Geyser/Floodgate only publish beta builds on Modrinth
      # scalablelux + c2me-fabric are pinned to alpha version IDs (only 26.3 builds); bump them when VERSION changes
      # no comments inside the MODRINTH_PROJECTS block: they'd be read as part of the mod name
      MEMORY: "6G"
      DIFFICULTY: "normal"
      LEVEL: "Brrr"
      SEED: "<redacted>"
      MOTD: "<redacted-domain> | Shineori SMP"
      MAX_PLAYERS: "12"
      ONLINE_MODE: "TRUE"          # keep TRUE: tunnel is public, only legit accounts
      ENABLE_WHITELIST: "TRUE"     # extra important with a public tunnel
      OPS: "Shineori"
      TZ: "America/New_York"
    ports:
      - "25565:25565"              # Java (playit tunnel -> <LAN_IP>:25565)
      - "19132:19132/udp"          # Bedrock via Geyser (playit UDP tunnel -> <LAN_IP>:19132)
      - "8100:8100"                # BlueMap web map (LAN port)
    volumes:
      - ./mc-data:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 1m
      interval: 20s
      retries: 10

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: shineori-playit
    restart: unless-stopped
    network_mode: host
    environment:
      SECRET_KEY: <redacted>
    depends_on:
      - mc

networks:
  mc-bridge:
    external: true   # created once: sudo docker network create mc-bridge
