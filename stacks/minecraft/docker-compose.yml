# =============================================================
#  <redacted-domain>  |  Minecraft Java (paste-only, free)
#  Friends type ONLY  <redacted-domain>  in vanilla Minecraft.
#
#  How it works:
#    - mc   : the Minecraft server, listening on TCP 25565
#    - ddns : keeps your Cloudflare DNS record pointed at your
#             home IP automatically (home IPs change over time)
#  You also add a DNS record + one router port-forward (see guide).
# =============================================================

services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: shineori-mc
    tty: true
    stdin_open: true
    restart: unless-stopped
    environment:
      EULA: "TRUE"                 # you accept Mojang's EULA
      TYPE: "PAPER"                # fast, vanilla-compatible. Use VANILLA/FABRIC/FORGE if you like
      VERSION: "1.21.5"            # or pin e.g. "1.21.4"
      MEMORY: "2G"                 # tune to your NAS RAM (leave headroom for the OS)
      DIFFICULTY: "normal"
      MOTD: "<redacted-domain> | Shineori SMP"
      MAX_PLAYERS: "10"
      ONLINE_MODE: "TRUE"          # keep TRUE so only legit accounts join
      ENABLE_WHITELIST: "TRUE"     # recommended for a public address (see guide to add friends)
      # OPS: "YourMinecraftName"   # uncomment + set to auto-op yourself
      TZ: "America/New_York"       # change to your timezone
    ports:
      - "25565:25565"              # this is what the router forwards to
    volumes:
      - ./mc-data:/data            # world + configs persist here on the NAS
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 1m
      interval: 20s
      retries: 10
