services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - "13379:80"
    volumes:
      - ./Audiobooks:/audiobooks
      - ./Podcasts:/podcasts
      - ./config:/config
      - ./metadata:/metadata
    environment:
      - TZ=America/New_York
    restart: unless-stopped
