services:
  app:
    image: monica:4.1.2-apache
    container_name: monica
    depends_on:
      - db
    ports:
      - "<LAN_IP>:3012:80"   # bound to the laptop's LAN IP only
    env_file: .env
    volumes:
      - ./data:/var/www/html/storage   # uploads, avatars, etc.
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: monica-db
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=monica
      - MYSQL_USER=monica
      - MYSQL_PASSWORD=${DB_PASSWORD}   # pulled from .env
    volumes:
      - ./mysql:/var/lib/mysql
    restart: unless-stopped
